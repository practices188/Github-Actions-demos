name: Build NodeJS Application

on:
  workflow_dispatch:

  push:
    paths:
      - 'GithubActions-NodeJs-Demo/**'

jobs:
  job1:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: github-nodejs-demo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: github-nodejs-demo/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build
